spring.application.name=bus2holiday
server.port=${PORT:8081}

# Load ignored local secrets for `mvnw spring-boot:run`; Docker supplies these as environment variables.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Hibernate owns table creation and additive schema updates; Flyway migrations are not used.
# schema.sql ensures PostgreSQL enum types/legacy status columns; data.sql seeds reference data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# schema.sql and data.sql run after Hibernate schema creation.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Pending bookings hold seats for 15 minutes while the customer completes payment.
app.reservations.pending-ttl-minutes=${PENDING_RESERVATION_TTL_MINUTES:15}
app.reservations.expiration-scan-ms=${PENDING_RESERVATION_EXPIRATION_SCAN_MS:30000}

# JWT_SECRET must be Base64-encoded key material (at least 32 decoded bytes).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Set this secret in the backend environment to enable administrator self-registration.
# Leave unset to disable public administrator account creation.
app.admin-registration-key=${ADMIN_REGISTRATION_KEY:}
