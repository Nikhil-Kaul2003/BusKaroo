spring.application.name=bus2holiday
server.port=${PORT:8081}

# Load ignored local secrets for `mvnw spring-boot:run`; Docker supplies these as environment variables.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


spring.flyway.enabled=false

# Hibernate auto-creates PostgreSQL enum types via @JdbcTypeCode(NAMED_ENUM)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# data.sql runs AFTER Hibernate DDL (seeds data)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT_SECRET must be Base64-encoded key material (at least 32 decoded bytes).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Set this secret in the backend environment to enable administrator self-registration.
# Leave unset to disable public administrator account creation.
app.admin-registration-key=${ADMIN_REGISTRATION_KEY:}
